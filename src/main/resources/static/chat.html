        /* 流式时局部更新某条消息（支持动态创建思考面板与正文） */
        function updateStreamingMessage(msg) {
            let el = document.querySelector(`.msg[data-msg-id="${msg.id}"]`);
            // 如果找不到 ID，兜底找最后一个 AI 消息
            if (!el) {
                const allAi = document.querySelectorAll('.msg-ai');
                if (allAi.length > 0) el = allAi[allAi.length - 1];
            }
            if (!el) return;
            const contentEl = el.querySelector('.msg-content');
            if (!contentEl) return;

            // ========== 1. 动态更新思考面板 ==========
            let reasoningEl = contentEl.querySelector('.reasoning');
            if (msg.reasoning) {
                if (!reasoningEl) {
                    // 之前没有思考面板，动态创建一个，并默认展开
                    reasoningEl = document.createElement('div');
                    reasoningEl.className = 'reasoning open';
                    reasoningEl.id = 'reason-' + msg.id;
                    reasoningEl.innerHTML = `
                        <div class="reasoning-head" data-reason-toggle="${msg.id}">
                            <span>正在思考...</span>${ICON.chevron}
                        </div>
                        <div class="reasoning-body"></div>
                    `;
                    contentEl.insertBefore(reasoningEl, contentEl.firstChild);
                }
                const bodyEl = reasoningEl.querySelector('.reasoning-body');
                if (bodyEl) {
                    bodyEl.textContent = msg.reasoning;
                    bodyEl.style.maxHeight = '400px'; 
                    bodyEl.style.padding = '8px 12px 12px';
                    bodyEl.scrollTop = bodyEl.scrollHeight; // 自动滚动到底部
                }
            }

            // ========== 2. 动态更新正文内容 ==========
            let mdEl = contentEl.querySelector('.md');
            const thinkingDots = contentEl.querySelector('.thinking');
            
            if (!msg.content) {
                if (mdEl) mdEl.remove();
                // 如果既没有正文，也没有思考内容，才显示跳动的点
                if (!thinkingDots && !msg.reasoning) {
                    const t = document.createElement('div');
                    t.className = 'thinking';
                    t.innerHTML = '<i></i><i></i><i></i>';
                    contentEl.appendChild(t);
                }
            } else {
                if (thinkingDots) thinkingDots.remove();
                if (!mdEl) {
                    mdEl = document.createElement('div');
                    mdEl.className = 'md';
                    contentEl.appendChild(mdEl);
                }
                mdEl.innerHTML = renderMarkdown(msg.content) + (msg.status === 'generating' ? '<span class="cursor"></span>' : '');
            }

            // 内容变多时自动滚动到底部
            scrollToBottom(false);
        }

        /* ============================================================
           11. 附件区
           ============================================================ */
        function renderAttachPreview() {
            const el = $('#attachPreview');
            if (!State.attachments.length) { el.innerHTML = ''; return; }
            el.innerHTML = State.attachments.map((a, i) => {
                const statusHtml = a.parseStatus === 'pending'
                    ? '<div class="ap-status">解析中…</div>'
                    : a.parseStatus === 'failed'
                        ? '<div class="ap-status error">解析失败</div>'
                        : '';
                if (a.kind === 'image' && a.url) {
                    return `<div class="ap-item" data-att-idx="${i}">
                        <img src="${a.url}">
                        <div class="ap-info"><div class="ap-name">${escapeHtml(a.name)}</div><div class="ap-meta">${a.meta && a.meta.width ? a.meta.width + '×' + a.meta.height : formatSize(a.size)}</div>${statusHtml}</div>
                        <button class="ap-remove" data-att-remove="${i}">${ICON.close}</button>
                    </div>`;
                }
                const ext = (a.name.split('.').pop() || '').toUpperCase().slice(0, 4);
                return `<div class="ap-item" data-att-idx="${i}">
                    <div class="ap-icon">${ext}</div>
                    <div class="ap-info"><div class="ap-name">${escapeHtml(a.name)}</div><div class="ap-meta">${formatSize(a.size)}</div>${statusHtml}</div>
                    <button class="ap-remove" data-att-remove="${i}">${ICON.close}</button>
                </div>`;
            }).join('');
        }

        /* ============================================================
           12. 输入框
           ============================================================ */
        function updateSendBtn() {
            const btn = $('#sendBtn');
            const hasText = $('#input').value.trim().length > 0;
            const hasAtt = State.attachments.length > 0;
            if (isStreaming()) {
                btn.disabled = false;
                btn.classList.add('stop');
                btn.innerHTML = ICON.stop;
                btn.title = '停止生成';
            } else {
                btn.disabled = !(hasText || hasAtt);
                btn.classList.remove('stop');
                btn.innerHTML = ICON.send;
                btn.title = '发送';
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }

        /* ============================================================
           13. 会话切换
           ============================================================ */
        async function switchConversation(id) {
            if (isStreaming()) stopStream();
            State.activeId = id;
            State.messages = [];
            State.editingId = null;
            if (id) {
                try {
                    const res = await api.listMessages(id, { size: 200 });
                    State.messages = res.items;
                } catch (e) { toast('加载消息失败：' + e.message); }
            }
            renderMessages();
            renderSidebar();
            scrollToBottom(true);
        }

        function scrollToBottom(force) {
            const el = $('#chatScroll');
            if (!el) return;
            const near = el.scrollHeight - el.scrollTop - el.clientHeight < 150;
            if (force || near) el.scrollTop = el.scrollHeight;
        }

        /* ============================================================
           14. 发送 / 流式 (核心重构)
           ============================================================ */
        async function ensureActiveConversation() {
            if (State.activeId) return State.activeId;
            const conv = await api.createConversation({});
            State.activeId = conv.id;
            return conv.id;
        }

        // 通用的流处理 Handlers 生成器，减少重复代码
        function createStreamHandlers(convId, scheduleRenderCallback) {
            let activeMsg = null; // 记录当前正在拼接的消息

            return {
                getActiveMsg: () => activeMsg,
                setActiveMsg: (msg) => { activeMsg = msg; },
                onEvent(evt) {
                    // 1. 收到消息开始事件
                    if (evt.type === 'message_start') {
                        activeMsg = {
                            id: evt.messageId || ('m_' + uid()),
                            conversationId: convId,
                            role: evt.role || 'assistant',
                            content: '',
                            reasoning: '',
                            citations: [],
                            feedback: 0,
                            status: 'generating',
                            createdAt: new Date().toISOString()
                        };
                        State.messages.push(activeMsg);
                        renderMessages();
                        scrollToBottom(true);
                        return;
                    }

                    // 兜底：如果没有 message_start，收到 delta 或 thinking 时自动创建
                    if (!activeMsg && ['delta', 'content', 'thinking', 'reasoning'].includes(evt.type)) {
                        activeMsg = {
                            id: evt.messageId || ('m_' + uid()),
                            conversationId: convId,
                            role: 'assistant',
                            content: '',
                            reasoning: '',
                            citations: [],
                            feedback: 0,
                            status: 'generating',
                            createdAt: new Date().toISOString()
                        };
                        State.messages.push(activeMsg);
                        renderMessages();
                        scrollToBottom(true);
                    }

                    // 2. 处理思考
                    if (evt.type === 'thinking' || evt.type === 'reasoning') {
                        const chunk = evt.content || evt.delta || evt.reasoning_content || '';
                        if (chunk && activeMsg) {
                            activeMsg.reasoning = (activeMsg.reasoning || '') + chunk;
                            scheduleRenderCallback(activeMsg);
                        }
                    }

                    // 3. 处理正文
                    if (evt.type === 'delta' || evt.type === 'content') {
                        if (evt.reasoning_content && activeMsg) {
                            activeMsg.reasoning = (activeMsg.reasoning || '') + evt.reasoning_content;
                        }
                        const chunk = evt.content || evt.delta || '';
                        if (chunk && activeMsg) {
                            activeMsg.content += chunk;
                            scheduleRenderCallback(activeMsg);
                        }
                    }

                    // 4. 消息生成完成（多轮之间）
                    if (evt.type === 'message_end') {
                        if (activeMsg) {
                            activeMsg.status = 'complete';
                            activeMsg = null;
                            renderMessages();
                        }
                    }

                    // 5. 整个请求彻底结束
                    if (evt.type === 'done') {
                        if (activeMsg) {
                            if (evt.message) {
                                activeMsg.content = evt.message.content || activeMsg.content;
                                activeMsg.reasoning = evt.message.reasoning || activeMsg.reasoning;
                            }
                            activeMsg.status = 'complete';
                            activeMsg = null;
                        }
                        finishStreamUI();
                    }

                    // 6. 错误
                    if (evt.type === 'error') {
                        if (activeMsg) {
                            activeMsg.status = 'error';
                        }
                        toast('生成失败：' + (evt.message || evt.code || ''));
                        finishStreamUI();
                    }
                },
                onError(err) {
                    if (activeMsg) activeMsg.status = 'error';
                    toast('生成失败：' + (err.message || ''));
                    finishStreamUI();
                }
            };
        }

        async function sendMessage(rawText) {
            const text = (rawText || '').trim();
            if ((!text && !State.attachments.length) || isStreaming()) return;

            let attachmentIds = [];
            if (State.attachments.length) {
                attachmentIds = State.attachments.map(a => a.fileId).filter(Boolean);
            }

            const convId = await ensureActiveConversation();

            let userMsg;
            try {
                userMsg = await api.sendMessage(convId, { content: text, attachmentIds });
            } catch (e) {
                toast('发送失败：' + e.message);
                return;
            }

            State.messages.push(userMsg);
            renderMessages();
            scrollToBottom(true);

            $('#input').value = '';
            autoResize($('#input'));
            State.attachments = [];
            renderAttachPreview();
            updateSendBtn();

            const controller = new AbortController();
            State.stream = { controller };
            updateSendBtn();

            let rafPending = false;
            const scheduleRender = (msg) => {
                if (rafPending) return;
                rafPending = true;
                requestAnimationFrame(() => {
                    rafPending = false;
                    updateStreamingMessage(msg);
                    scrollToBottom(false);
                });
            };

            const handlers = createStreamHandlers(convId, scheduleRender);

            try {
                await api.streamChat({
                    conversationId: convId,
                    content: text,
                    attachmentIds,
                    modelId: State.prefs.modelId,
                    deepThink: State.prefs.deepThink,
                    webSearch: State.prefs.webSearch
                }, handlers, controller.signal);
            } catch (e) {
                if (e.name !== 'AbortError') toast('生成失败：' + (e.message || ''));
            } finally {
                if (State.stream && State.stream.controller === controller) {
                    finishStreamUI();
                }
            }
        }

        function finishStreamUI() {
            if (State.stream) {
                State.stream = null;
            }
            // 确保所有处于 generating 的消息都变为 complete
            State.messages.forEach(m => {
                if (m.status === 'generating') m.status = 'complete';
            });
            renderMessages();
            scrollToBottom(false);
            renderSidebar();
            updateSendBtn();
        }

        function stopStream() {
            if (State.stream) {
                try { State.stream.controller.abort(); } catch (_) { }
                State.stream = null;
                State.messages.forEach(m => {
                    if (m.status === 'generating') m.status = 'interrupted';
                });
                renderMessages();
                updateSendBtn();
                toast('已停止生成');
            }
        }

        /* ============================================================
           15. 重新生成 / 编辑
           ============================================================ */
        async function regenerate(msgId) {
            if (isStreaming()) { toast('请先停止当前生成'); return; }
            const convId = State.activeId;
            if (!convId) return;
            const idx = State.messages.findIndex(m => m.id === msgId);
            if (idx < 0) return;
            let userIdx = -1;
            for (let i = idx - 1; i >= 0; i--) {
                if (State.messages[i].role === 'user') { userIdx = i; break; }
            }
            if (userIdx < 0) return;
            const question = State.messages[userIdx].content;

            State.messages = State.messages.slice(0, userIdx + 1);
            renderMessages();

            const controller = new AbortController();
            State.stream = { controller };
            updateSendBtn();

            let rafPending = false;
            const scheduleRender = (msg) => {
                if (rafPending) return;
                rafPending = true;
                requestAnimationFrame(() => { rafPending = false; updateStreamingMessage(msg); scrollToBottom(false); });
            };

            const handlers = createStreamHandlers(convId, scheduleRender);

            try {
                await api.streamChat({
                    conversationId: convId,
                    regenerateMessageId: msgId,
                    content: question,
                    modelId: State.prefs.modelId,
                    deepThink: State.prefs.deepThink,
                    webSearch: State.prefs.webSearch
                }, handlers, controller.signal);
            } catch (e) {
                if (e.name !== 'AbortError') toast('生成失败：' + e.message);
            } finally {
                if (State.stream && State.stream.controller === controller) finishStreamUI();
            }
        }

        function startEditMessage(msgId) {
            const msg = State.messages.find(m => m.id === msgId);
            if (!msg || msg.role !== 'user') return;
            State.editingId = msgId;
            renderMessages();
            const ta = $(`#editTa-${msgId}`);
            if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }

        async function saveEditMessage(msgId) {
            const ta = $(`#editTa-${msgId}`);
            if (!ta) return;
            const content = ta.value.trim();
            if (!content) { toast('内容不能为空'); return; }
            try {
                const res = await api.editMessage(msgId, { content });
                const idx = State.messages.findIndex(m => m.id === msgId);
                State.messages = State.messages.slice(0, idx + 1);
                State.messages[idx] = res.message;
                State.editingId = null;
                renderMessages();
                await triggerAfterEdit(msgId);
            } catch (e) {
                toast('保存失败：' + e.message);
            }
        }

        async function triggerAfterEdit(userMsgId) {
            const convId = State.activeId;
            if (!convId) return;
            const userMsg = State.messages.find(m => m.id === userMsgId);
            const question = userMsg ? userMsg.content : '';

            const controller = new AbortController();
            State.stream = { controller };
            updateSendBtn();
            let rafPending = false;
            const scheduleRender = (msg) => {
                if (rafPending) return;
                rafPending = true;
                requestAnimationFrame(() => { rafPending = false; updateStreamingMessage(msg); scrollToBottom(false); });
            };
            const handlers = createStreamHandlers(convId, scheduleRender);

            try {
                await api.streamChat({
                    conversationId: convId,
                    content: question,
                    attachmentIds: (userMsg.attachments || []).map(a => a.fileId),
                    modelId: State.prefs.modelId,
                    deepThink: State.prefs.deepThink,
                    webSearch: State.prefs.webSearch
                }, handlers, controller.signal);
            } catch (e) {
                if (e.name !== 'AbortError') toast('生成失败：' + e.message);
            } finally {
                if (State.stream && State.stream.controller === controller) finishStreamUI();
            }
        }

        /* ============================================================
           16. 文件上传
           ============================================================ */
        async function handleFiles(fileList) {
            const files = Array.from(fileList).slice(0, 10 - State.attachments.length);
            if (!files.length) return;
            for (const f of files) {
                if (f.size > 20 * 1024 * 1024) { toast(`「${f.name}」超过 20MB`); return; }
            }
            try {
                const res = await api.uploadFiles(files);
                State.attachments.push(...res.items);
                renderAttachPreview();
                updateSendBtn();
                res.items.forEach(a => {
                    if (a.parseStatus === 'pending') pollParse(a.fileId);
                });
            } catch (e) {
                toast('上传失败：' + e.message);
            }
        }

        async function pollParse(fileId) {
            for (let i = 0; i < 15; i++) {
                await new Promise(r => setTimeout(r, 2000));
                try {
                    const f = await api.getFile(fileId);
                    const local = State.attachments.find(a => a.fileId === fileId);
                    if (local) Object.assign(local, f);
                    if (f.parseStatus !== 'pending') { renderAttachPreview(); return; }
                } catch (_) { return; }
            }
        }

        /* ============================================================
           17. 事件绑定
           ============================================================ */
        function bindEvents() {
            const app = $('#app');
            const input = $('#input');

            $('#toggleSidebar').addEventListener('click', () => {
                if (window.innerWidth <= 820) {
                    app.classList.toggle('collapsed');
                    $('#overlay').classList.toggle('show', !app.classList.contains('collapsed'));
                } else {
                    app.classList.toggle('collapsed');
                }
            });
            $('#overlay').addEventListener('click', () => {
                app.classList.add('collapsed');
                $('#overlay').classList.remove('show');
            });

            const doSearch = debounce(async () => {
                try { await renderSidebar(); } catch (e) { }
            }, 300);
            $('#searchInput').addEventListener('input', (e) => {
                State.search.q = e.target.value.trim();
                $('#searchScope').classList.toggle('show', !!State.search.q);
                doSearch();
            });
            $('#searchScope').addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-scope]');
                if (!btn) return;
                State.search.scope = btn.dataset.scope;
                $$('#searchScope button').forEach(b => b.classList.toggle('on', b === btn));
                if (State.search.q) doSearch();
            });

            $('#newChatBtn').addEventListener('click', async () => {
                if (isStreaming()) stopStream();
                try {
                    const conv = await api.createConversation({});
                    State.activeId = conv.id;
                    State.messages = [];
                    State.editingId = null;
                    renderMessages();
                    await renderSidebar();
                    if (window.innerWidth <= 820) {
                        app.classList.add('collapsed');
                        $('#overlay').classList.remove('show');
                    }
                    input.focus();
                } catch (e) { toast('创建失败：' + e.message); }
            });

            $('#chatList').addEventListener('click', async (e) => {
                const del = e.target.closest('[data-del]');
                if (del) {
                    e.stopPropagation();
                    const id = del.dataset.del;
                    if (!confirm('确定删除该对话？')) return;
                    try {
                        await api.deleteConversation(id);
                        if (State.activeId === id) { State.activeId = null; State.messages = []; renderMessages(); }
                        await renderSidebar();
                        toast('已删除');
                    } catch (err) { toast('删除失败：' + err.message); }
                    return;
                }
                const item = e.target.closest('.chat-item');
                if (item) {
                    await switchConversation(item.dataset.id);
                    if (window.innerWidth <= 820) {
                        app.classList.add('collapsed');
                        $('#overlay').classList.remove('show');
                    }
                }
            });

            const modelDropdown = $('#modelDropdown');
            $('#modelSelect').addEventListener('click', (e) => {
                e.stopPropagation();
                closeDropdowns(modelDropdown);
                modelDropdown.classList.toggle('show');
                $('#modelSelect').setAttribute('aria-expanded', modelDropdown.classList.contains('show') ? 'true' : 'false');
            });
            modelDropdown.addEventListener('click', async (e) => {
                const item = e.target.closest('[data-model]');
                if (!item) return;
                State.prefs.modelId = item.dataset.model;
                const m = State.models.find(x => x.id === item.dataset.model);
                $('#modelName').textContent = m ? m.name : item.dataset.model;
                modelDropdown.classList.remove('show');
                $('#modelSelect').setAttribute('aria-expanded', 'false');
                try { await api.putPrefs({ modelId: State.prefs.modelId }); } catch (_) { }
                toast('已切换到 ' + (m ? m.name : item.dataset.model));
            });

            const moreDropdown = $('#moreDropdown');
            $('#moreBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeDropdowns(moreDropdown);
                moreDropdown.classList.toggle('show');
            });
            moreDropdown.addEventListener('click', async (e) => {
                const item = e.target.closest('[data-more]');
                if (!item) return;
                moreDropdown.classList.remove('show');
                const act = item.dataset.more;

                if (act === 'export') {
                    if (!State.messages.length) { toast('当前没有可导出的对话'); return; }
                    const conv = State.conversations.find(c => c.id === State.activeId);
                    const title = conv ? conv.title : '对话';
                    const md = State.messages.map(m =>
                        (m.role === 'user' ? '## 👤 用户\n\n' : '## 🤖 DeepSeek\n\n') + m.content
                    ).join('\n\n---\n\n');
                    const blob = new Blob([`# ${title}\n\n` + md], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = title + '.md'; a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    toast('已导出为 Markdown');
                } else if (act === 'rename') {
                    if (!State.activeId) { toast('当前没有对话'); return; }
                    const conv = State.conversations.find(c => c.id === State.activeId);
                    const name = prompt('新的对话名称：', conv ? conv.title : '');
                    if (name && name.trim()) {
                        try {
                            await api.renameConversation(State.activeId, name.trim().slice(0, 50));
                            await renderSidebar();
                            toast('已重命名');
                        } catch (err) { toast('重命名失败：' + err.message); }
                    }
                } else if (act === 'clearAll') {
                    if (!State.conversations.length) { toast('没有可清空的对话'); return; }
                    if (!confirm('确定清空全部对话？此操作不可恢复。')) return;
                    if (isStreaming()) stopStream();
                    try {
                        await api.clearConversations();
                        State.conversations = [];
                        State.activeId = null;
                        State.messages = [];
                        renderMessages();
                        await renderSidebar();
                        toast('已清空');
                    } catch (err) { toast('清空失败：' + err.message); }
                }
            });

            $('#themeBtn').addEventListener('click', async () => {
                State.prefs.theme = State.prefs.theme === 'dark' ? 'light' : 'dark';
                applyTheme();
                try { await api.putPrefs({ theme: State.prefs.theme }); } catch (_) { }
                toast(State.prefs.theme === 'dark' ? '已切换到暗色' : '已切换到浅色');
            });

            $('#shareBtn').addEventListener('click', async () => {
                if (!State.messages.length) { toast('当前没有可分享的内容'); return; }
                const text = State.messages.map(m =>
                    (m.role === 'user' ? '👤 ' : '🤖 ') + m.content
                ).join('\n\n---\n\n');
                const ok = await copyText(text);
                toast(ok ? '对话内容已复制' : '复制失败');
            });

            $('#pillDeep').addEventListener('click', async () => {
                State.prefs.deepThink = !State.prefs.deepThink;
                $('#pillDeep').classList.toggle('active', State.prefs.deepThink);
                try { await api.putPrefs({ deepThink: State.prefs.deepThink }); } catch (_) { }
            });
            $('#pillWeb').addEventListener('click', async () => {
                State.prefs.webSearch = !State.prefs.webSearch;
                $('#pillWeb').classList.toggle('active', State.prefs.webSearch);
                try { await api.putPrefs({ webSearch: State.prefs.webSearch }); } catch (_) { }
            });

            $('#suggGrid').addEventListener('click', (e) => {
                const card = e.target.closest('.sugg-card');
                if (!card || isStreaming()) return;
                sendMessage(card.dataset.q);
            });

            input.addEventListener('input', () => { autoResize(input); updateSendBtn(); });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    if (isStreaming()) return;
                    sendMessage(input.value);
                }
            });

            $('#sendBtn').addEventListener('click', () => {
                if (isStreaming()) { stopStream(); return; }
                sendMessage(input.value);
            });

            $('#attachBtn').addEventListener('click', () => $('#fileInput').click());
            $('#fileInput').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length) handleFiles(e.target.files);
                e.target.value = '';
            });

            $('#attachPreview').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-att-remove]');
                if (!btn) return;
                const idx = parseInt(btn.dataset.attRemove);
                const att = State.attachments[idx];
                if (att && att.fileId) api.deleteFile(att.fileId).catch(() => { });
                State.attachments.splice(idx, 1);
                renderAttachPreview();
                updateSendBtn();
            });

            $('#msgList').addEventListener('click', async (e) => {
                const codeBtn = e.target.closest('.code-copy');
                if (codeBtn) {
                    const code = decodeURIComponent(codeBtn.dataset.code || '');
                    const ok = await copyText(code);
                    if (ok) {
                        const old = codeBtn.textContent;
                        codeBtn.textContent = '已复制';
                        setTimeout(() => codeBtn.textContent = old, 1500);
                    } else toast('复制失败');
                    return;
                }
                const reasonToggle = e.target.closest('[data-reason-toggle]');
                if (reasonToggle) {
                    const box = reasonToggle.closest('.reasoning');
                    if (box) box.classList.toggle('open');
                    return;
                }
                const editCancel = e.target.closest('[data-edit-cancel]');
                if (editCancel) {
                    State.editingId = null;
                    renderMessages();
                    return;
                }
                const editSave = e.target.closest('[data-edit-save]');
                if (editSave) {
                    saveEditMessage(editSave.dataset.editSave);
                    return;
                }
                const actBtn = e.target.closest('[data-act]');
                if (!actBtn) return;
                const act = actBtn.dataset.act;
                const id = actBtn.dataset.id;
                const msg = State.messages.find(m => m.id === id);
                if (!msg) return;

                if (act === 'copy') {
                    const ok = await copyText(msg.content);
                    toast(ok ? '已复制' : '复制失败');
                } else if (act === 'regen') {
                    regenerate(id);
                } else if (act === 'edit') {
                    startEditMessage(id);
                } else if (act === 'like' || act === 'dislike') {
                    const target = act === 'like' ? 1 : -1;
                    const newFb = msg.feedback === target ? 0 : target;
                    try {
                        const updated = await api.feedback(id, newFb);
                        msg.feedback = updated.feedback;
                        renderMessages();
                        toast(newFb === 1 ? '感谢反馈 👍' : newFb === -1 ? '已记录，会改进' : '已取消反馈');
                    } catch (err) { toast('反馈失败：' + err.message); }
                }
            });

            document.addEventListener('click', () => {
                closeDropdowns();
                $('#modelSelect').setAttribute('aria-expanded', 'false');
            });

            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    $('#newChatBtn').click();
                }
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth > 820) $('#overlay').classList.remove('show');
            });
        }

        function closeDropdowns(except) {
            $$('.dropdown').forEach(d => { if (d !== except) d.classList.remove('show'); });
        }

        /* ============================================================
           18. 初始化
           ============================================================ */
        async function init() {
            try {
                await ensureLogin();
            } catch (e) {
                toast('登录失败：' + e.message);
                return;
            }

            if (CONFIG.useMock) initMockDB();

            try {
                const [user, models, prefs] = await Promise.all([
                    api.me(), api.models(), api.getPrefs()
                ]);
                State.user = user;
                State.models = models.items;
                State.prefs = Object.assign(State.prefs, prefs);
            } catch (e) {
                toast('初始化失败：' + e.message);
                return;
            }

            applyTheme();
            renderUser();
            $('#modelName').textContent = (State.models.find(m => m.id === State.prefs.modelId) || State.models[0] || {}).name || 'DeepSeek-V3';
            $('#pillDeep').classList.toggle('active', !!State.prefs.deepThink);
            $('#pillWeb').classList.toggle('active', !!State.prefs.webSearch);
            renderEmptyState();
            renderMessages();
            renderAttachPreview();
            bindEvents();
            updateSendBtn();

            const modelDropdown = $('#modelDropdown');
            modelDropdown.innerHTML = State.models.map(m => `
                <div class="dropdown-item" data-model="${m.id}">
                    <span>${escapeHtml(m.name)}</span>
                    ${m.badge ? `<span class="badge">${escapeHtml(m.badge)}</span>` : ''}
                </div>`).join('');

            await renderSidebar();

            if (State.conversations.length) {
                await switchConversation(State.conversations[0].id);
            } else {
                State.activeId = null;
                State.messages = [];
                renderMessages();
            }

            if (window.innerWidth <= 820) $('#app').classList.add('collapsed');

            setTimeout(() => $('#input').focus(), 100);
        }

        init().catch(e => {
            console.error(e);
            toast('初始化失败：' + e.message);
        });
    </script>
</body>

</html>
