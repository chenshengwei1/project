<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 · 服务器开小差了</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf0e8 0%, #f6f9fc 50%, #e8eef6 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景装饰圆 */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: #e76f51;
      top: -120px;
      right: -120px;
    }
    body::after {
      width: 380px;
      height: 380px;
      background: #2b7a78;
      bottom: -110px;
      left: -110px;
    }

    .error-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      box-shadow: 0 30px 60px -20px rgba(50, 20, 0, 0.25);
      padding: 3.5rem 3rem;
      max-width: 560px;
      width: 90%;
      text-align: center;
      animation: floatIn 0.8s ease both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .error-code {
      font-size: 7.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #e76f51 0%, #f4a261 50%, #e9c46a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }

    .error-icon {
      font-size: 3rem;
      color: #e76f51;
      margin-bottom: 1rem;
      animation: shake 3s infinite;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0); }
      10% { transform: rotate(-8deg); }
      20% { transform: rotate(8deg); }
      30% { transform: rotate(-6deg); }
      40% { transform: rotate(6deg); }
      50%, 90% { transform: rotate(0); }
    }

    .error-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e2b3c;
      margin-bottom: 0.75rem;
    }

    .error-desc {
      color: #5a6e85;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #e76f51, #f4a261);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 20px -8px rgba(231, 111, 81, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-home:hover {
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 16px 28px -8px rgba(231, 111, 81, 0.65);
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-left: 0.75rem;
      background: transparent;
      color: #2b7a78;
      border: 2px solid #2b7a78;
      border-radius: 50px;
      padding: 0.75rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: #2b7a78;
      color: #fff;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #9aa8b8;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    @media (max-width: 576px) {
      .error-card { padding: 2.5rem 1.5rem; }
      .error-code { font-size: 5.5rem; }
      .error-title { font-size: 1.4rem; }
      .error-desc { font-size: 0.95rem; }
      .btn-retry { margin-left: 0; margin-top: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-triangle-exclamation"></i>
    </div>
    <div class="error-code">500</div>
    <h1 class="error-title">服务器开小差了</h1>
    <p class="error-desc">
      服务器在处理请求时遇到了意外问题。<br>
      我们已经记录下这个情况，你可以稍后重试或返回首页。
    </p>
    <div class="button-group">
      <a href="/" class="btn-home">
        <i class="fas fa-house"></i> 返回门户首页
      </a>
      <a href="javascript:location.reload()" class="btn-retry">
        <i class="fas fa-rotate-right"></i> 重新加载
      </a>
    </div>
    <div class="hint">
      <i class="fas fa-shield-halved me-1"></i>
      错误代码：500 Internal Server Error
    </div>
  </div>
</body>
</html>
