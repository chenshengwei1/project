<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>405 · 请求方式不被允许</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eef0ff 0%, #f6f9fc 50%, #ebe8fb 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景装饰圆 */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.32;
      z-index: 0;
    }
    body::before {
      width: 440px;
      height: 440px;
      background: #6366f1;
      top: -130px;
      left: -120px;
    }
    body::after {
      width: 380px;
      height: 380px;
      background: #a78bfa;
      bottom: -110px;
      right: -110px;
    }

    .error-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      box-shadow: 0 30px 60px -20px rgba(50, 30, 90, 0.22);
      padding: 3.5rem 3rem;
      max-width: 560px;
      width: 90%;
      text-align: center;
      animation: floatIn 0.8s ease both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .error-code {
      font-size: 7.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #a78bfa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }

    .error-icon {
      font-size: 3rem;
      color: #4f46e5;
      margin-bottom: 1rem;
      animation: pulseStop 2.8s infinite;
    }

    @keyframes pulseStop {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.12); opacity: 0.85; }
    }

    .error-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e2b3c;
      margin-bottom: 0.75rem;
    }

    .error-desc {
      color: #5a6e85;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    /* 方法提示徽章 */
    .method-badge {
      display: inline-block;
      margin-bottom: 1.75rem;
      padding: 0.45rem 1.1rem;
      border-radius: 50px;
      background: #eef0ff;
      color: #4f46e5;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid #d7dafc;
    }
    .method-badge i { margin-right: 0.4rem; }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 20px -8px rgba(79, 70, 229, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-home:hover {
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 16px 28px -8px rgba(79, 70, 229, 0.65);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-left: 0.75rem;
      background: transparent;
      color: #4f46e5;
      border: 2px solid #4f46e5;
      border-radius: 50px;
      padding: 0.75rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: #4f46e5;
      color: #fff;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #9aa8b8;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    @media (max-width: 576px) {
      .error-card { padding: 2.5rem 1.5rem; }
      .error-code { font-size: 5.5rem; }
      .error-title { font-size: 1.4rem; }
      .error-desc { font-size: 0.95rem; }
      .btn-back { margin-left: 0; margin-top: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-hand"></i>
    </div>
    <div class="error-code">405</div>
    <h1 class="error-title">请求方式不被允许</h1>
    <p class="error-desc">
      该地址不支持你当前使用的请求方法。<br>
      请检查请求方式（GET / POST / PUT / DELETE 等）是否正确。
    </p>
    <div class="method-badge">
      <i class="fas fa-shield-halved"></i> Method Not Allowed
    </div>
    <div class="button-group">
      <a href="/" class="btn-home">
        <i class="fas fa-house"></i> 返回门户首页
      </a>
      <a href="javascript:history.back()" class="btn-back">
        <i class="fas fa-arrow-left"></i> 返回上一页
      </a>
    </div>
    <div class="hint">
      <i class="fas fa-circle-info me-1"></i>
      错误代码：405 Method Not Allowed
    </div>
  </div>
</body>
</html>
