<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面走丢了</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e8f0fe 0%, #f6f9fc 50%, #eef2f7 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景装饰圆 */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: #2b7a78;
      top: -120px;
      left: -120px;
    }
    body::after {
      width: 360px;
      height: 360px;
      background: #ffb74d;
      bottom: -100px;
      right: -100px;
    }

    .error-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      box-shadow: 0 30px 60px -20px rgba(0, 30, 50, 0.25);
      padding: 3.5rem 3rem;
      max-width: 560px;
      width: 90%;
      text-align: center;
      animation: floatIn 0.8s ease both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .error-code {
      font-size: 7.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #2b7a78 0%, #3aafa9 60%, #ffb74d 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }

    .error-icon {
      font-size: 3rem;
      color: #2b7a78;
      margin-bottom: 1rem;
      animation: bounce 2.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .error-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e2b3c;
      margin-bottom: 0.75rem;
    }

    .error-desc {
      color: #5a6e85;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #2b7a78, #3aafa9);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 20px -8px rgba(43, 122, 120, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-home:hover {
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 16px 28px -8px rgba(43, 122, 120, 0.65);
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #9aa8b8;
    }

    @media (max-width: 576px) {
      .error-card { padding: 2.5rem 1.5rem; }
      .error-code { font-size: 5.5rem; }
      .error-title { font-size: 1.4rem; }
      .error-desc { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-compass"></i>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">页面走丢了</h1>
    <p class="error-desc">
      你访问的页面可能已被移动、删除，或者链接输错了。<br>
      别担心，回到主页继续探索吧。
    </p>
    <a href="/" class="btn-home">
      <i class="fas fa-house"></i> 返回门户首页
    </a>
    <div class="hint">
      <i class="fas fa-lightbulb me-1"></i>
      错误代码：404 Not Found
    </div>
  </div>
</body>
</html>
